name: Bug report
description: Something in @pimbay/search-query isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected instead, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet (adapter + call) that reproduces it.
      render: typescript
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error message/stack trace, if any. Redact anything sensitive.
      render: shell
